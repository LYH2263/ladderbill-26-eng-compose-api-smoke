services:
  backend:
    build: ./backend
    ports:
      - "9100:9100"
    volumes:
      - ladderbill_data:/data
    environment:
      DATA_DIR: /data
    healthcheck:
      # 镜像为 python:3.12-slim，无 curl/wget，直接用标准库探活
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:9100/api/health',timeout=3); sys.exit(0 if r.status==200 and json.load(r).get('ok') is True else 1)"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 5s
  frontend:
    build: ./frontend
    ports:
      - "4100:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  ladderbill_data:
